[workspace]
members = ["crates/apex-core", "crates/apex-storage", "apps/desktop/src-tauri"]
default-members = ["crates/apex-core", "crates/apex-storage"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
