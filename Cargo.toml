[workspace]
members = ["crates/apex-core", "crates/apex-storage", "apps/desktop/src-tauri"]
default-members = ["crates/apex-core", "crates/apex-storage"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.release]
debug = 1
