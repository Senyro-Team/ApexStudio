name: Foundation checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:extension
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex_sync_test
          POSTGRES_PASSWORD: apex_sync_test
          POSTGRES_DB: apex_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_sync_test -d apex_sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APEX_SYNC_TEST_DATABASE_URL: postgres://apex_sync_test:apex_sync_test@localhost:5432/apex_sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apps/sync-server/Cargo.toml --all --check
      - run: cargo test --locked
      - run: cargo test --manifest-path apps/sync-server/Cargo.toml --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --manifest-path apps/sync-server/Cargo.toml --locked
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked -p apex-desktop
