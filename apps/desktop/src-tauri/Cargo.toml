[package]
name = "apex-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "apex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
keyring = { version = "3.6", features = ["windows-native"] }
zeroize = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v7"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde.workspace = true
apex-core = { path = "../../../crates/apex-core" }
apex-storage = { path = "../../../crates/apex-storage" }

[lints]
workspace = true
