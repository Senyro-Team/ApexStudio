[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "apex-studio-cli"
path = "src/main.rs"

[dependencies]
apex-application = { path = "../../crates/apex-application" }
apex-core = { path = "../../crates/apex-core" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
csv = "1.4"
crossterm = "0.29.0"
dirs = "7.0.0"
sha2 = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
tempfile = "3"
zeroize = "1"

[dev-dependencies]
apex-storage = { path = "../../crates/apex-storage" }

[lints]
workspace = true
