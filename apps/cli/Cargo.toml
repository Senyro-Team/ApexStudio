[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "apex-studio-cli"
path = "src/main.rs"

[dependencies]
apex-application = { path = "../../crates/apex-application" }
apex-core = { path = "../../crates/apex-core" }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std"] }
serde_json = "1"

[dev-dependencies]
apex-storage = { path = "../../crates/apex-storage" }
tempfile = "3"

[lints]
workspace = true
