# Standalone alternative to compose.yaml. Do not merge the two files.
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apex_sync
      POSTGRES_USER: apex_sync
      POSTGRES_PASSWORD: ${APEX_SYNC_DB_PASSWORD:?Set APEX_SYNC_DB_PASSWORD in .env.tunnel}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_sync -d apex_sync"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APEX_SYNC_BIND: 0.0.0.0:8080
      APEX_SYNC_DATABASE_URL: postgres://apex_sync:${APEX_SYNC_DB_PASSWORD:?Set APEX_SYNC_DB_PASSWORD in .env.tunnel}@database:5432/apex_sync
      APEX_SYNC_DATA_DIR: /data
      APEX_SYNC_MAX_BLOB_STORAGE_BYTES: ${APEX_SYNC_MAX_BLOB_STORAGE_BYTES:-8589934592}
      APEX_SYNC_BOOTSTRAP_TOKEN: ${APEX_SYNC_BOOTSTRAP_TOKEN:-}
      APEX_IMAGE_PROVIDER_URL: ${APEX_IMAGE_PROVIDER_URL:-}
      APEX_IMAGE_PROVIDER_KEY: ${APEX_IMAGE_PROVIDER_KEY:-}
      APEX_INVITE_TRACKER_URL: ${APEX_INVITE_TRACKER_URL:-}
      APEX_INVITE_TRACKER_KEY: ${APEX_INVITE_TRACKER_KEY:-}
      RUST_LOG: info
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - tunnel
    volumes:
      - blob-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.tunnel}
    depends_on:
      - api
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true
  tunnel:

volumes:
  database-data:
  blob-data:
